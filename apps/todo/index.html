<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Master</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- MAIN CSS -->
    <link rel="stylesheet" href="/assets/css/todo.css">
</head>
<body class="min-h-screen p-8">
    <noscript>This app requires JavaScript to function and work properly, use a browser that supports JavaScript to get the best experience.</noscript>
    <div class="container mx-auto max-w-4xl">
        <div class="card p-8">
            <!-- Header -->
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Task Master</h1>
                    <p class="text-gray-600">Believe in yourself!</p>
                </div>
                <div class="flex gap-4">
                    <button id="addTaskBtn" class="btn-primary text-white px-4 py-2 rounded-lg flex items-center gap-2">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                    <button id="viewGraphBtn" class="btn-secondary text-white px-4 py-2 rounded-lg flex items-center gap-2">
                        <i class="fas fa-chart-bar"></i> View Graph
                    </button>
                </div>
            </div>

            <!-- Search -->
            <div class="mb-6">
                <input type="text" id="searchInput" class="w-full p-3 border rounded-lg" placeholder="Search Tasks...">
            </div>

            <!-- Statistics -->
            <div class="grid grid-cols-4 gap-4 mb-6">
                <div class="stat-card total rounded-lg p-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-2xl font-bold text-blue-600" id="totalTasks">0</h3>
                            <p class="text-sm text-blue-600">Total Tasks</p>
                        </div>
                        <i class="fas fa-tasks text-blue-500 text-xl"></i>
                    </div>
                </div>
                <div class="stat-card completed rounded-lg p-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-2xl font-bold text-green-600" id="completedTasks">0</h3>
                            <p class="text-sm text-green-600">Completed</p>
                        </div>
                        <i class="fas fa-check-circle text-green-500 text-xl"></i>
                    </div>
                </div>
                <div class="stat-card upcoming rounded-lg p-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-2xl font-bold text-yellow-600" id="upcomingTasks">0</h3>
                            <p class="text-sm text-yellow-600">Upcoming</p>
                        </div>
                        <i class="fas fa-clock text-yellow-500 text-xl"></i>
                    </div>
                </div>
                <div class="stat-card overdue rounded-lg p-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-2xl font-bold text-red-600" id="overdueTasks">0</h3>
                            <p class="text-sm text-red-600">Overdue</p>
                        </div>
                        <i class="fas fa-exclamation-circle text-red-500 text-xl"></i>
                    </div>
                </div>
            </div>

            <!-- Task List -->
            <div id="taskList" class="space-y-4"></div>

            <!-- Graph Section -->
            <div id="graphSection" class="hidden mt-6">
                <canvas id="taskGraph" class="w-full"></canvas>
            </div>
        </div>
    </div>

    <!-- Task Modal -->
    <div id="taskModal" class="fixed inset-0 hidden modal flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4">Add New Task</h2>
            <form id="taskForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Title</label>
                        <input type="text" id="taskTitle" class="w-full p-2 border rounded-lg" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Due Date</label>
                        <input type="date" id="taskDueDate" class="w-full p-2 border rounded-lg" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Priority</label>
                        <select id="taskPriority" class="w-full p-2 border rounded-lg">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Description</label>
                        <textarea id="taskDescription" class="w-full p-2 border rounded-lg" rows="3"></textarea>
                    </div>
                </div>
                <div class="flex justify-end gap-4 mt-6">
                    <button type="button" id="cancelTaskBtn" class="px-4 py-2 text-gray-600 hover:text-gray-800">
                        Cancel
                    </button>
                    <button type="submit" class="btn-primary text-white px-4 py-2 rounded-lg">
                        Add Task
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <script src="/assets/js/todo.js" defer></script>
</body>
</html>
